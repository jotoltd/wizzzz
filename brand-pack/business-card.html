<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WIZZZ Business Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 60px; font-family: "Space Grotesk", sans-serif; }
  .card {
    width: 85mm;
    height: 55mm;
    border-radius: 4mm;
    overflow: hidden;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  /* FRONT */
  .card-front {
    background: #0a0604;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: radial-gradient(ellipse at 20% 50%, rgba(255,138,0,0.2), transparent 50%),
                      radial-gradient(ellipse at 80% 50%, rgba(214,20,31,0.15), transparent 50%);
  }
  .card-front .wordmark {
    font-family: "Metamorphous", serif;
    font-size: 32px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ffb347, #ff8a00, #ff4d00, #d6141f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .card-front .tagline {
    position: absolute;
    bottom: 6mm;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 7px;
    letter-spacing: 3px;
    color: rgba(255,138,0,0.6);
    text-transform: uppercase;
  }
  /* BACK */
  .card-back {
    background: #0a0604;
    padding: 8mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background-image: radial-gradient(ellipse at 80% 20%, rgba(255,138,0,0.1), transparent 50%);
  }
  .card-back .name {
    font-family: "Metamorphous", serif;
    font-size: 14px;
    color: #fff7f2;
    margin-bottom: 1mm;
  }
  .card-back .role {
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ff8a00;
    margin-bottom: 4mm;
  }
  .card-back .detail {
    font-size: 8px;
    color: rgba(255,247,242,0.7);
    line-height: 1.8;
  }
  .card-back .detail a { color: #ff8a00; text-decoration: none; }
  .card-back .trading {
    margin-top: auto;
    font-size: 6px;
    color: rgba(255,247,242,0.3);
  }
  .card-label {
    color: #888;
    font-size: 12px;
    margin-top: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div>
  <div class="card card-front">
    <div class="wordmark">WIZZZ</div>
    <div class="tagline">Websites · iOS Apps · Ads</div>
  </div>
  <div class="card-label">Front</div>
</div>

<div>
  <div class="card card-back">
    <div class="name">JOSH</div>
    <div class="role">WIZZZ</div>
    <div class="detail">
      <a href="mailto:hello@wizzz.co.uk">hello@wizzz.co.uk</a><br>
      <a href="https://wizzz.co.uk">wizzz.co.uk</a>
    </div>
    <div class="trading">A trading name of Gedker Ltd</div>
  </div>
  <div class="card-label">Back</div>
</div>

</body>
</html>
