<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIZZZ Brand Sting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0604;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: "Space Grotesk", sans-serif;
  }
  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .glow-bg {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,138,0,0.3), transparent 60%);
    opacity: 0;
    animation: glowIn 1.5s ease-out 0.2s forwards;
  }
  @keyframes glowIn { to { opacity: 1; } }

  .wordmark {
    font-family: "Metamorphous", serif;
    font-size: 120px;
    letter-spacing: 6px;
    display: flex;
    position: relative;
    z-index: 2;
  }
  .wordmark span {
    opacity: 0;
    display: inline-block;
    animation: letterIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  .wordmark span:nth-child(1) { animation-delay: 0.3s; }
  .wordmark span:nth-child(2) { animation-delay: 0.45s; }
  .wordmark span:nth-child(3) { animation-delay: 0.6s; }
  .wordmark span:nth-child(4) { animation-delay: 0.75s; }
  .wordmark span:nth-child(5) { animation-delay: 0.9s; }

  @keyframes letterIn {
    from { opacity: 0; transform: translateY(40px) scale(0.8); filter: blur(10px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  .w { color: #ffb347; }
  .i { color: #ff8a00; }
  .z1 { color: #ff8a00; }
  .z2 { color: #ff4d00; }
  .z3 { color: #d6141f; }

  .tagline {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,138,0,0.7);
    opacity: 0;
    animation: tagIn 0.6s ease-out 1.3s forwards;
  }
  @keyframes tagIn { to { opacity: 1; } }

  .flame-line {
    position: absolute;
    bottom: 40%;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 3px;
    background: linear-gradient(90deg, #ffb347, #ff8a00, #ff4d00, #d6141f);
    border-radius: 2px;
    animation: lineGrow 0.4s ease-out 1.1s forwards;
    z-index: 1;
  }
  @keyframes lineGrow { to { width: 400px; } }
</style>
</head>
<body>

<div class="stage">
  <div class="glow-bg"></div>
  <div class="flame-line"></div>
  <div class="wordmark">
    <span class="w">W</span>
    <span class="i">I</span>
    <span class="z1">Z</span>
    <span class="z2">Z</span>
    <span class="z3">Z</span>
  </div>
  <div class="tagline">Websites · iOS Apps · Ads</div>
</div>

</body>
</html>
